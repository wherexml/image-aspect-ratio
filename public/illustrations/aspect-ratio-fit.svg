<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 584 240" role="img" aria-labelledby="arf-title arf-desc" width="100%" style="max-width:100%;height:auto">
<title id="arf-title">Fit, Fill and Stretch: a 16:9 image in a square frame</title>
<desc id="arf-desc">The same 16:9 landscape with a circular sun placed in three 1:1 frames. Fit scales the whole image to the frame width and leaves empty bars above and below. Fill scales the image to the frame height and crops equal amounts from the left and right, cutting off the tree. Stretch squeezes the image horizontally to fill the square, so the circular sun becomes a tall oval.</desc>
<style>
.arf-brand{fill:var(--brand, #D96A1B)}
.arf-tint{fill:var(--brand, #D96A1B);fill-opacity:.1}
.arf-fg{fill:var(--foreground, #182332)}
.arf-muted{fill:var(--muted-foreground, #566273)}
.arf-card{fill:var(--card, #ffffff)}
.arf-far{fill:var(--muted-foreground, #566273);fill-opacity:.32}
.arf-near{fill:var(--foreground, #182332);fill-opacity:.72}
.arf-sky{fill:var(--brand, #D96A1B);fill-opacity:.08}
.arf-line{fill:none;stroke:var(--brand, #D96A1B);stroke-width:2}
.arf-edge{fill:none;stroke:var(--border, #dce0e5);stroke-width:1.5}
.arf-dim{fill:none;stroke:var(--muted-foreground, #566273);stroke-width:1.25;stroke-linecap:round}
.arf-grid{fill:none;stroke:var(--card, #ffffff);stroke-opacity:.55;stroke-width:.75}
.arf-t{font-family:var(--font-sans, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif);fill:var(--foreground, #182332)}
.arf-s{font-family:var(--font-sans, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif);fill:var(--muted-foreground, #566273)}
</style>
<pattern id="arf-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="arf-card" width="7" height="7"/><path d="M0 0V7" stroke="var(--border, #dce0e5)" stroke-width="3"/></pattern>
<text class="arf-t" x="100" y="22" text-anchor="middle" font-size="19" font-weight="700">Fit</text><clipPath id="arf-clip-fit"><rect x="16" y="34" width="168" height="168" rx="4"/></clipPath><g clip-path="url(#arf-clip-fit)"><rect class="arf-card" x="16" y="34" width="168" height="168"/><rect fill="url(#arf-hatch)" x="16" y="34" width="168" height="36.75"/><rect fill="url(#arf-hatch)" x="16" y="165.25" width="168" height="36.75"/><g transform="translate(16 70.75) scale(1.05)"><rect class="arf-card" width="160" height="90"/><rect class="arf-sky" width="160" height="90"/><circle class="arf-brand" cx="104" cy="30" r="13"/><path class="arf-far" d="M0 90V60L28 38L50 54L82 26L118 58L140 46L160 56V90Z"/><path class="arf-near" d="M0 90V72C26 62 52 64 80 71S134 76 160 66V90Z"/><rect class="arf-near" x="16.5" y="58" width="3" height="10"/><path class="arf-near" d="M18 40L27 60H9Z"/></g><rect class="arf-line" x="16" y="70.75" width="168" height="94.5"/></g><rect class="arf-edge" x="16" y="34" width="168" height="168" rx="4"/><text class="arf-s" x="100" y="226" text-anchor="middle" font-size="13.5">Whole image + padding</text>
<text class="arf-t" x="292" y="22" text-anchor="middle" font-size="19" font-weight="700">Fill</text><clipPath id="arf-clip-fill"><rect x="208" y="34" width="168" height="168" rx="4"/></clipPath><g clip-path="url(#arf-clip-fill)"><rect class="arf-card" x="208" y="34" width="168" height="168"/><g transform="translate(142.66666666666667 34) scale(1.8666666666666667)"><rect class="arf-card" width="160" height="90"/><rect class="arf-sky" width="160" height="90"/><circle class="arf-brand" cx="104" cy="30" r="13"/><path class="arf-far" d="M0 90V60L28 38L50 54L82 26L118 58L140 46L160 56V90Z"/><path class="arf-near" d="M0 90V72C26 62 52 64 80 71S134 76 160 66V90Z"/><rect class="arf-near" x="16.5" y="58" width="3" height="10"/><path class="arf-near" d="M18 40L27 60H9Z"/></g></g><rect class="arf-edge" x="208" y="34" width="168" height="168" rx="4"/><text class="arf-s" x="292" y="226" text-anchor="middle" font-size="13.5">Sides cropped</text>
<text class="arf-t" x="484" y="22" text-anchor="middle" font-size="19" font-weight="700">Stretch</text><clipPath id="arf-clip-stretch"><rect x="400" y="34" width="168" height="168" rx="4"/></clipPath><g clip-path="url(#arf-clip-stretch)"><rect class="arf-card" x="400" y="34" width="168" height="168"/><g transform="translate(400 34) scale(1.05 1.8666666666666667)"><rect class="arf-card" width="160" height="90"/><rect class="arf-sky" width="160" height="90"/><circle class="arf-brand" cx="104" cy="30" r="13"/><path class="arf-far" d="M0 90V60L28 38L50 54L82 26L118 58L140 46L160 56V90Z"/><path class="arf-near" d="M0 90V72C26 62 52 64 80 71S134 76 160 66V90Z"/><rect class="arf-near" x="16.5" y="58" width="3" height="10"/><path class="arf-near" d="M18 40L27 60H9Z"/></g></g><rect class="arf-edge" x="400" y="34" width="168" height="168" rx="4"/><text class="arf-s" x="484" y="226" text-anchor="middle" font-size="13.5">Proportions changed</text>
</svg>
